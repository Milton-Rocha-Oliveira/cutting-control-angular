services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_BOOTSTRAP_EMAIL: ${APP_BOOTSTRAP_EMAIL}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD}
      APP_BOOTSTRAP_NAME: ${APP_BOOTSTRAP_NAME:-Administrador}
      APP_BOOTSTRAP_USER_ID: ${APP_BOOTSTRAP_USER_ID}
      APP_DATA_ENCRYPTION_KEY: ${APP_DATA_ENCRYPTION_KEY}
      APP_PUBLIC_REGISTRATION: ${APP_PUBLIC_REGISTRATION:-true}
      AUTH_RATE_LIMIT_CAPACITY: ${AUTH_RATE_LIMIT_CAPACITY:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: ${PUBLIC_API_URL}/api
      PUBLIC_REGISTRATION: ${APP_PUBLIC_REGISTRATION:-true}
    ports:
      - "127.0.0.1:8088:80"

volumes:
  postgres_data:
