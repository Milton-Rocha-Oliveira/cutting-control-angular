# Database - configure according to your Postgres / Supabase instance
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/cutcontrol}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security - placeholder for JWT or other auth integration
app.auth.jwtSecret=${APP_JWT_SECRET:change-me}

# Server port
server.port=8080
