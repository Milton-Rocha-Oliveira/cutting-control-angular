spring:
  profiles:
    default: prod
  application.name: controle-de-cortes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cortes}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
server.port: ${PORT:8080}
management.endpoints.web.exposure.include: health,info
app:
  jwt:
    secret: ${APP_JWT_SECRET}
  auth:
    public-registration: ${APP_PUBLIC_REGISTRATION:true}
    rate-limit:
      capacity: ${AUTH_RATE_LIMIT_CAPACITY:10}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  bootstrap:
    email: ${APP_BOOTSTRAP_EMAIL:}
    password: ${APP_BOOTSTRAP_PASSWORD:}
    name: ${APP_BOOTSTRAP_NAME:Administrador}
    user-id: ${APP_BOOTSTRAP_USER_ID:}
  data-encryption-key: ${APP_DATA_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
